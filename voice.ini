; ============================================================
;  VoiceChat — SERVER configuration (authoritative)
;  File: voice.ini
;
;  Read by the .dll (game-server bridge), which forwards the relevant
;  bits to the relay (.exe) over IPC. ONE file, no duplication. Platform
;  independent: identical on open.mp and SA-MP, no dependency on
;  config.json / server.cfg.
;
;  ZERO-CONFIG: every value below is a sane default. You can delete this
;  file entirely and the system runs. Out-of-range values log a warning
;  and fall back to the default — they NEVER crash the relay.
;
;  This file is AUTHORITATIVE. Anything here that affects fairness or other
;  players (range, falloff, occlusion, allowed frequencies, allowed mode)
;  cannot be overridden by clients. The client keeps only local prefs
;  (devices, volumes, PTT key) in its own voicechat.ini.
; ============================================================

[network]
; UDP ports. control = .dll -> .exe (loopback). audio = .asi <-> .exe.
control_port      = 7778
audio_port        = 7779
; Public IP/host clients use to reach the relay (LAN/WAN). 0.0.0.0 = bind all.
bind_address      = 0.0.0.0
max_players       = 200
; Max datagram payload (Opus frame ceiling). Leave default unless you know why.
audio_mtu         = 1400

[audio]
; Opus. 16-24 kbps is the sweet spot for voice (req. C1).
codec             = opus
bitrate           = 24000          ; 16000..32000 reasonable
sample_rate       = 48000          ; relay-side DSP rate
frame_ms          = 20
; Server-side normalisation + limiter (req. J12 anti-earrape).
normalize         = true
limiter_ceiling   = 0.95           ; 0..1 peak ceiling
; Voice Activity Detection allowed as a transmit trigger (besides PTT).
vad_allowed       = true
default_mode      = ptt            ; ptt | vad  (server default for clients)
allow_mode_switch = true           ; may clients toggle ptt<->vad themselves

[proximity]
; Range presets in game units (req. D2). Clients pick a preset; the value
; is authoritative (a client can't widen it = no "audio wallhack", req. H).
range_whisper     = 8.0
range_normal      = 18.0
range_shout       = 40.0
max_range         = 40.0           ; hard ceiling for any override
; Falloff curve exponent (req. D1). 1.0 = linear; >1 = loud-near, fast mid
; drop, gentle tail (natural). 2.0 is a good logarithmic-feel default.
falloff_exp       = 2.0
; Occlusion (req. J4): closed vehicles/walls muffle voice in/out.
occlusion         = true
occlusion_atten   = 0.45           ; 0=silent .. 1=no muffle
; Stereo panning strength from relative position (req. D3).
pan_strength      = 0.8
; Performance/anti-chaos caps (req. F, J14).
max_audible_speakers = 6           ; nearest-N simultaneous proximity voices
max_streams_per_client = 8

[radio]
; Frequency model (req. E3). Adjustable freqs via Pawn (/setfreq), not
; hardcoded channels. These are just defaults/limits.
freq_min          = 1.0
freq_max          = 999.99
freq_step         = 0.1
; Radio voice colouring (req. E1): bandpass like a real handset.
bandpass_low_hz   = 300
bandpass_high_hz  = 3000
; Squelch beep on PTT press/release + faint static (req. E2).
squelch_beep      = true
static_level      = 0.05           ; 0=off
; Half-duplex garble when two transmit on one freq simultaneously (req. E4).
half_duplex_garble= true

[security]
; Cryptographic identity (req. A). Token replaces IP identification.
token_bytes       = 32
token_ttl_seconds = 30             ; single-use; client must handshake within
encrypt_audio     = true           ; XChaCha20-Poly1305 AEAD (req. A2)
anti_replay       = true           ; reject stale/duplicate nonces
; Keep IP only as a SECONDARY sanity check, never as identity.
ip_secondary_check= true
; Optional shared secret to authenticate the .dll->.exe control channel
; (loopback, but defense-in-depth). Empty = derive from first bind.
ipc_secret        =

[behavior]
; Default per-player mixing policy (req. I4). mix | duck | exclusive.
; duck recommended: low-priority buses quiet down when a higher one talks.
mix_policy        = duck
duck_level        = 0.5            ; 0=mute secondary .. 1=no duck
proximity_floor   = 0.25          ; proximity never fully ducked (req. I4 safety)
; Dead/spectator transmit on proximity? (req. J13). off = dead are silent.
dead_can_talk     = false
; Speakerphone: when a player enables it (Voice_SetSpeakerphone), the call audio
; they hear is also played into their proximity for bystanders (req. J6). This is
; the server-wide enable; nobody is on speaker until the gamemode toggles them.
speakerphone      = true
; Suppress the channel copy of a source already audible by proximity (J5).
suppress_double_play = true

[logging]
level             = info           ; error | warn | info | debug
log_file          = voice_relay.log
log_connections   = true
log_audio_stats   = false          ; per-frame stats are noisy; debug only
