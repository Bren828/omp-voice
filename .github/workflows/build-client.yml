name: build-client

on:
  workflow_dispatch:

jobs:
  windows-x86-client:
    runs-on: windows-latest
    name: Windows x86 client (.asi)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake, Win32)
        run: >
          cmake -S . -B build-client -A Win32
          -DVC_NO_SODIUM=OFF
          -DVC_WITH_OPUS=ON
          -DVC_BUILD_CLIENT=ON
          -DVC_BUILD_SAMP=OFF
          -DVC_BUILD_RELAY=OFF
          -DVC_BUILD_OMP=OFF
          -DVC_BUILD_TESTS=OFF
          -DVC_CLIENT_GUI=ON
          -DVC_WITH_RNNOISE=ON

      - name: Build client (Release)
        run: cmake --build build-client --config Release --parallel

      - name: Collect client artifact
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-client | Out-Null
          $client = 'build-client/client/Release/VoiceChat.asi'
          if (Test-Path $client) {
            Copy-Item $client dist-client/VoiceChat.asi -Force
          }
          Get-ChildItem dist-client | Format-Table Length, Name

      - name: Upload client
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voicechat-client-win32
          path: dist-client/
          if-no-files-found: warn
