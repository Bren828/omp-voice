; ============================================================
;  VoiceChat v2 — config CLIENT (.asi), preferinte LOCALE
;  Pune acest fisier langa gta_sa.exe / samp.exe (folderul GTA SA).
;  NU afecteaza alti jucatori — doar setarile tale locale.
; ============================================================

[network]
; >>> SETEAZA AICI IP-ul SERVERULUI (open.mp/SA-MP) <<<
; Daca serverul ruleaza pe alt PC in LAN, pune IP-ul lui (ex: 192.168.0.178).
; Daca testezi totul pe acelasi PC, lasa 127.0.0.1.
relay_ip   = 127.0.0.1
audio_port = 7779
cmd_port   = 7780        ; portul pe care .dll trimite token-ul (lasa asa)

[keys]
ptt_key  = B             ; tine apasat = vorbesti pe PROXIMITATE
ptt_key2 = N             ; tine apasat = vorbesti pe RADIO (foloseste cu /vradio)
mute_key = F9            ; toggle self-mute

[audio]
master_volume    = 1.0
proximity_volume = 1.0
radio_volume     = 1.0
mic_volume       = 1.0
vad_enabled      = false ; true = mic deschis automat cand vorbesti (peste PTT)
vad_threshold    = 0.02
